name: HK143 unadjusted daily prices and low-position screen

on:
  schedule:
    # 19:17 Beijing time (UTC+8), Monday-Friday = 11:17 UTC, Monday-Friday.
    - cron: '17 11 * * 1-5'
  workflow_dispatch:


permissions:
  contents: write

concurrency:
  group: hk143-data-update
  # A newer run must replace an older stuck/slow run instead of waiting behind it.
  cancel-in-progress: true

jobs:
  # Automatic daily run enabled at 19:17 Beijing time.
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate screener rules (offline tests)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_cloud_run.py tests/test_entry_signals.py tests/test_risk_manager.py tests/test_ths_watchlist_sync.py
      - name: Fetch, validate and screen (per-stock timeout + source fallback)
        run: >-
          python cloud_run.py --output . --delay 2.0 --attempts 2
          --secondary-attempts 1 --source-timeout 20 --stock-timeout 75
      - name: Identify 2B, retest, breakdown and local strengthening
        run: python entry_signals.py --output .
      - name: Assess 2B/retest conditional entry and 8 percent risk
        run: python risk_manager.py --output .
      - name: Export verified Tonghuashun custom-group XML
        run: python ths_watchlist_sync.py --output .
      - name: Publish updated data and report to repository
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No file changes'
          else
            git commit -m "Update HK143 unadjusted daily data"
            git push
          fi
