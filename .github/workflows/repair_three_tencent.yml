name: Repair three HK143 historical CSV gaps with Tencent

on:
  push:
    paths:
      - "repair_three_tencent.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hk143-repair-three
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Repair 03908, 01357 and 01428 with Tencent
        run: python repair_three_tencent.py
      - name: Verify and publish repaired CSVs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/2025/03908_2025.csv data/2026/03908_2026.csv                   data/2025/01357_2025.csv data/2026/01357_2026.csv                   data/2025/01428_2025.csv data/2026/01428_2026.csv
          if git diff --cached --quiet; then
            echo 'No CSV changes'
          else
            git commit -m "Repair three HK143 historical CSV gaps with Tencent"
            git push
          fi
