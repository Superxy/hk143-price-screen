name: HK143 historical bottom-pattern research
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_backtest.py'
      - '.github/workflows/research.yml'
permissions:
  contents: write
jobs:
  compare-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Analyze realized 2026 daily bars
        run: python research_backtest.py
      - name: Publish study (does not change daily screener)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/bottom_study.json research/bottom_study.md
          if git diff --cached --quiet; then
            echo 'No research changes'
          else
            git commit -m 'Publish HK143 bottom-pattern backtest'
            git push
          fi
