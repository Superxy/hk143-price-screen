name: HK143 comparison of 2R 3R and prior resistance exits
on:
  workflow_dispatch:
  push:
    paths:
      - 'exit_backtest.py'
      - 'tests/test_exit_backtest.py'
      - '.github/workflows/exit_backtest.yml'
permissions:
  contents: write
jobs:
  compare-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_exit_backtest.py
      - name: Backtest 2025-2026 daily prices
        run: python exit_backtest.py --output . --fee-side 0.0015
      - name: Publish reproducible exit research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/exit_comparison.md research/exit_comparison.json research/exit_comparison_trades.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish HK143 2R 3R resistance exit comparison'
            git pull --rebase
            git push
          fi
